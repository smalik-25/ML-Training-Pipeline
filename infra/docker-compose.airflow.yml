# Local Airflow with the LocalExecutor (no Celery -- this is a portfolio
# project, keep it minimal) and a Postgres metadata DB. The repo is mounted so
# DAG/stage edits are picked up without rebuilding the image.
#
# Bring it up with:  make airflow-up   (UI at http://localhost:8080, admin/admin)
#
# Note on dependencies: the stage tasks need the heavy runtime libs (PySpark,
# Torch, Ray, MLflow). We install the project's [spark,train] extras into the
# Airflow image at startup via _PIP_ADDITIONAL_REQUIREMENTS. That makes first
# boot slow and the image large -- acceptable for a local demo. In a real
# deployment you'd bake a custom Airflow image instead. The DAG's *structure* is
# verified independently of all this by tests/test_dag.py.
version: "3.8"

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Install the project + heavy extras so `import stages.*` works in tasks.
    _PIP_ADDITIONAL_REQUIREMENTS: "-e /opt/airflow/repo[spark,train]"
    # Stage config + credentials (sourced from your .env at the repo root).
    PIPELINE_CONFIG: /opt/airflow/repo/config/pipeline_config.yaml
    FEATURE_CONFIG: /opt/airflow/repo/config/feature_config.yaml
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  volumes:
    # Mount the whole repo so `-e` install + stage imports resolve, and mount
    # dags/ to the conventional location Airflow scans.
    - ..:/opt/airflow/repo
    - ../dags:/opt/airflow/dags
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: migrate the metadata DB and create the admin user, then exit.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname admin --lastname admin --role Admin --email admin@example.com
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-pgdata:
