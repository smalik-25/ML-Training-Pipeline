# OPTIONAL: a faithful local S3 API (MinIO) for anyone who wants to exercise
# real s3:// paths in dev rather than the local filesystem. Not on the critical
# path -- the default dev/CI flow uses ./data through the same fsspec I/O layer.
version: "3.8"

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    volumes:
      - minio-data:/data

volumes:
  minio-data:
