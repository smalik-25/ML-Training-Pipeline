name: kicksdb-snapshot-refresh

# Pull the current KicksDB market on a schedule, score it, and publish the
# snapshot the Streamlit Space reads. Budget: two requests per reference SKU
# (one StockX, one GOAT), so about 132 a run at 66 SKUs, ~4 runs/day, roughly
# 15.8k a month, well under the 50,000 cap.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Never let refresh runs stack up and burn extra requests.
concurrency:
  group: kicksdb-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # The snapshot producer only needs the scoring + adapter path, not the
      # Spark/Ray/MLflow stack, so install the light deps and the package without
      # its heavy ones. huggingface_hub both fetches the deployed model and
      # publishes the results. If a first run errors on a missing import, add it here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pandas pyarrow numpy fsspec pyyaml requests "huggingface_hub>=0.20"
          pip install -e . --no-deps

      # The model artifact is gitignored (*.pt), so it isn't in the checkout. The
      # deployed model already lives on the Space, so pull that exact file and score
      # with it: no binary committed to the repo, and the snapshot always reflects
      # the model the demo is actually serving. The drift history is the same story,
      # it accumulates across runs, so fetch the prior file (absent on the first run)
      # and let this run append to it instead of resetting to a single point.
      - name: Fetch the deployed model and prior history from the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os, shutil
          from huggingface_hub import hf_hub_download

          repo, token = "smalik25/sneaker-ml-platform", os.environ["HF_TOKEN"]
          os.makedirs("demo", exist_ok=True)

          model = hf_hub_download(repo_id=repo, repo_type="space",
                                  filename="model.pt", token=token)
          shutil.copy(model, "demo/model.pt")
          print("fetched deployed model -> demo/model.pt")

          try:
              hist = hf_hub_download(repo_id=repo, repo_type="space",
                                     filename="drift_history.json", token=token)
              shutil.copy(hist, "demo/drift_history.json")
              print("fetched prior drift history -> demo/drift_history.json")
          except Exception as exc:  # first run has none yet; start fresh
              print(f"no prior drift history on the Space ({exc}); starting fresh")
          PY

      - name: Pull the current KicksDB market and score it
        env:
          KICKSDB_API_KEY: ${{ secrets.KICKSDB_API_KEY }}
        run: python refresh_market_snapshot.py --run-date "$(date -u +%F)"

      - name: Publish the snapshot and history to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import upload_file

          repo, token = "smalik25/sneaker-ml-platform", os.environ["HF_TOKEN"]
          for local, remote in [
              ("demo/live_snapshot.json", "live_snapshot.json"),
              ("demo/drift_history.json", "drift_history.json"),
          ]:
              upload_file(
                  path_or_fileobj=local, path_in_repo=remote,
                  repo_id=repo, repo_type="space", token=token,
                  commit_message="refresh live market snapshot",
              )
              print(f"published {remote}")
          PY
